name: Sync APG secrets to Apps Script

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute authenticated Apps Script sync
        env:
          APPS_SCRIPT_API_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_API_DEPLOYMENT_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: node scripts/run-apg-sync.mjs --status-only
      - name: Sync encrypted APG secrets
        env:
          APPS_SCRIPT_API_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_API_DEPLOYMENT_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          APG_MERCHANT_ID: ${{ secrets.APG_MERCHANT_ID }}
          APG_STORE_ID: ${{ secrets.APG_STORE_ID }}
          APG_MERCHANT_HASH: ${{ secrets.APG_MERCHANT_HASH }}
          APG_MERCHANT_USERNAME: ${{ secrets.APG_MERCHANT_USERNAME }}
          APG_MERCHANT_PASSWORD: ${{ secrets.APG_MERCHANT_PASSWORD }}
          APG_KEY1: ${{ secrets.APG_KEY1 }}
          APG_KEY2: ${{ secrets.APG_KEY2 }}
          APG_SANDBOX_BASE: https://sandbox.bankalfalah.com
        run: node scripts/run-apg-sync.mjs
