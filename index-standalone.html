<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --soil:#2B2118;
  --soil-light:#3D3025;
  --kraft:#F1E6D0;
  --kraft-dark:#E4D4B4;
  --leaf:#3F6B3F;
  --leaf-dark:#2F5230;
  --marigold:#D68C2E;
  --marigold-dark:#B5731E;
  --chili:#B84A3E;
  --ink:#1F2A1C;
  --paper:#FBF6EB;
  --line:rgba(31,42,28,0.15);
  --radius:14px;
  --shadow:0 6px 20px rgba(43,33,24,0.14);
  --shadow-sm:0 2px 8px rgba(43,33,24,0.10);
  --header-h:58px;
  --sticky-h:64px;
  font-size:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:var(--paper);padding-bottom:0;}
body.has-sticky-bar{padding-bottom:var(--sticky-h);}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;}
img,svg{max-width:100%;}
button{font-family:inherit;cursor:pointer;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ══════════════ HEADER (mobile-first) ══════════════ */
.site-header{background:var(--soil);color:var(--kraft);position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.2);height:var(--header-h);}
.header-inner{max-width:1180px;height:100%;margin:0 auto;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.logo{display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem;background:none;border:none;color:var(--kraft);padding:0;}
.logo .seed-mark{width:24px;height:24px;flex:none;}

.mobile-nav-toggle{display:flex;flex-direction:column;justify-content:center;gap:4px;background:none;border:none;padding:8px;order:-1;}
.mobile-nav-toggle span{width:20px;height:2px;background:var(--kraft);border-radius:2px;}

.cart-icon-btn{background:var(--leaf);color:#fff;border:none;border-radius:10px;width:40px;height:40px;font-size:1.05rem;position:relative;display:flex;align-items:center;justify-content:center;}
.cart-icon-btn .count{position:absolute;top:-6px;right:-6px;background:var(--marigold);color:#241705;border-radius:999px;min-width:18px;height:18px;font-family:'IBM Plex Mono',monospace;font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}

.nav-tabs{
  display:none;position:fixed;top:var(--header-h);left:0;right:0;bottom:0;
  background:var(--soil);z-index:39;flex-direction:column;padding:10px 14px;gap:2px;overflow-y:auto;
}
.nav-tabs.open{display:flex;}
.nav-tab{
  font-family:'Inter',sans-serif;font-weight:600;font-size:1.02rem;
  background:none;color:rgba(241,230,208,.9);border:none;text-align:left;
  padding:14px 10px;border-bottom:1px solid rgba(241,230,208,.1);
}
.nav-tab.active{color:var(--marigold);}

@media (min-width:860px){
  :root{--header-h:64px;}
  .mobile-nav-toggle{display:none;}
  .nav-tabs{
    position:static;display:flex;flex-direction:row;background:none;padding:0;
    gap:2px;flex:1;justify-content:center;overflow:visible;
  }
  .nav-tab{
    padding:9px 14px;border-bottom:none;border-radius:6px;font-size:.92rem;position:relative;
  }
  .nav-tab::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;background:var(--marigold);opacity:0;transform:scaleX(.6);transition:opacity .15s ease, transform .15s ease;}
  .nav-tab:hover{color:#fff;background:rgba(241,230,208,.08);}
  .nav-tab.active::after{opacity:1;transform:scaleX(1);}
}

/* ══════════════ HERO (premium, mobile-first) ══════════════ */
.hero{
  position:relative;overflow:hidden;color:var(--kraft);
  background-image:
    url('assets/images/hero.jpg'),
    radial-gradient(120% 90% at 15% 0%, rgba(214,140,46,.28), transparent 55%),
    radial-gradient(100% 80% at 90% 100%, rgba(63,107,63,.35), transparent 60%),
    linear-gradient(165deg,var(--soil) 0%,var(--soil-light) 100%);
  background-size:cover, auto, auto, auto;
  background-position:center, center, center, center;
  padding:34px 18px 30px;
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(20,15,8,.55) 0%, rgba(20,15,8,.78) 100%);
}
.hero-inner{position:relative;max-width:1180px;margin:0 auto;}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(241,230,208,.1);border:1px solid rgba(241,230,208,.25);color:var(--kraft);font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;padding:5px 12px;border-radius:999px;margin-bottom:14px;}
.hero h1{font-size:clamp(1.7rem,6vw,2.9rem);line-height:1.1;margin:0 0 12px;font-weight:600;max-width:16ch;}
.hero p{font-size:.98rem;line-height:1.55;opacity:.85;max-width:42ch;margin:0 0 22px;}
.hero .cta-row{display:flex;gap:10px;flex-wrap:wrap;}
.btn{border:none;border-radius:10px;padding:13px 22px;font-weight:600;font-size:.94rem;display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:var(--marigold);color:#241705;box-shadow:0 4px 14px rgba(214,140,46,.35);}
.btn-primary:hover{background:var(--marigold-dark);}
.btn-secondary{background:rgba(241,230,208,.08);color:var(--kraft);border:1px solid rgba(241,230,208,.35);}

.trust-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;}
.trust-chip{display:flex;align-items:center;gap:7px;background:rgba(251,246,234,.06);border:1px solid rgba(241,230,208,.15);border-radius:10px;padding:9px 12px;font-size:.78rem;color:rgba(241,230,208,.85);}
.trust-chip .ic{font-size:.95rem;}

@media (min-width:860px){
  .hero{padding:64px 20px 56px;}
  .hero-inner{display:grid;grid-template-columns:1fr;max-width:720px;}
}

/* ══════════════ CATEGORY TILES (with real-asset slots) ══════════════ */
/* Drop real photos into assets/images/ using these filenames — the tile
   falls back to its gradient automatically if the file isn't there yet. */
.cat-grid{max-width:1180px;margin:-20px auto 0;padding:0 14px;position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cat-tile{
  border-radius:16px;overflow:hidden;position:relative;height:128px;box-shadow:var(--shadow);
  background-size:cover;background-position:center;
}
.cat-tile[data-cat="vegetables"]{background-image:url('assets/images/cat-vegetables.jpg'),linear-gradient(150deg,#3F6B3F,#274526);}
.cat-tile[data-cat="flowers"]{background-image:url('assets/images/cat-flowers.jpg'),linear-gradient(150deg,#D68C2E,#9C5D18);}
.cat-tile[data-cat="mix"]{background-image:url('assets/images/cat-mix.jpg'),linear-gradient(150deg,#B84A3E,#7C2E25);}
.cat-tile[data-cat="fertilizer"]{background-image:url('assets/images/cat-fertilizer.jpg'),linear-gradient(150deg,#6B4A2A,#432D19);}
.cat-tile::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg, rgba(20,15,8,.78) 0%, rgba(20,15,8,.15) 55%, transparent 90%);}
.cat-tile-content{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;color:#fff;z-index:1;}
.cat-tile-content .name{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;display:block;}
.cat-tile-content .count{font-size:.72rem;opacity:.85;font-family:'IBM Plex Mono',monospace;}
.cat-tile-btn{position:absolute;inset:0;background:none;border:none;width:100%;height:100%;z-index:2;}
@media (min-width:640px){.cat-grid{grid-template-columns:repeat(4,1fr);}.cat-tile{height:160px;}}

/* ══════════════ Page shell ══════════════ */
.page{max-width:1180px;margin:0 auto;padding:26px 14px 40px;}
.page.narrow{max-width:640px;}
.page-head{margin-bottom:18px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf-dark);}
.page-head h2{font-size:1.6rem;margin:4px 0 6px;}
.page-head .tagline{color:#5b5142;margin:0;font-size:.92rem;}
.section-title{font-family:'Fraunces',serif;font-size:1.3rem;margin:34px 0 14px;}
.why-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.why-card{background:var(--kraft);border-radius:12px;padding:16px 14px;box-shadow:var(--shadow-sm);}
.why-card .ic{font-size:1.3rem;margin-bottom:6px;display:block;}
.why-card h4{margin:0 0 3px;font-size:.92rem;font-family:'Inter',sans-serif;font-weight:700;}
.why-card p{margin:0;font-size:.8rem;color:#5b5142;line-height:1.4;}
@media (min-width:640px){.why-grid{grid-template-columns:repeat(4,1fr);}}

/* ══════════════ Journey / progress bar ══════════════ */
.journey-bar{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:10px;max-width:520px;margin-left:auto;margin-right:auto;}
.journey-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative;}
.journey-step .jn{width:28px;height:28px;border-radius:999px;background:var(--kraft-dark);color:#8a7f6b;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:.82rem;border:2px solid var(--kraft-dark);transition:all .2s ease;}
.journey-step .jl{font-size:.72rem;color:#8a7f6b;font-weight:600;}
.journey-step.done .jn{background:var(--leaf);border-color:var(--leaf);color:#fff;}
.journey-step.done .jl{color:var(--leaf-dark);}
.journey-step.active .jn{background:var(--marigold);border-color:var(--marigold);color:#241705;}
.journey-step.active .jl{color:var(--ink);}
.journey-line{flex:0 0 auto;width:100%;max-width:60px;height:2px;background:var(--kraft-dark);margin-top:-20px;}
.journey-step.done + .journey-line{background:var(--leaf);}

.flow-status{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:-14px 0 22px;font-size:.78rem;}
.flow-status .fs-item{padding:4px 10px;border-radius:999px;background:var(--kraft-dark);color:#6b6152;font-weight:600;}
.flow-status .fs-item.done{background:#dcead6;color:var(--leaf-dark);}

.cat-group-title{font-family:'IBM Plex Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:#8a7f6b;margin:18px 0 8px;padding-left:2px;}
.cat-group-title:first-child{margin-top:0;}
.cat-group-subtotal{font-size:.76rem;color:#6b6152;text-align:right;margin:-2px 0 12px;}

/* ══════════════ Product table (category pages) ══════════════ */
.product-table-wrap{background:var(--kraft);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;border:1px solid var(--kraft-dark);}
table.product-table{width:100%;border-collapse:collapse;}
.product-table thead th{
  text-align:left;font-family:'IBM Plex Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;
  color:#5b5142;padding:12px 14px;border-bottom:1px solid var(--kraft-dark);background:var(--kraft-dark);
}
.product-table tbody tr{border-bottom:1px solid rgba(228,212,180,.7);}
.product-table tbody tr:last-child{border-bottom:none;}
.product-table td{padding:11px 14px;vertical-align:middle;}
.p-name{display:flex;align-items:center;gap:11px;font-weight:600;font-size:.92rem;}
.p-icon{width:36px;height:36px;border-radius:8px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex:none;}
.p-unit{color:#7a6f5c;font-weight:400;font-size:.78rem;display:block;}
.p-price{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.88rem;}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--kraft-dark);border-radius:20px;overflow:hidden;background:var(--paper);}
.stepper button{background:none;border:none;width:30px;height:30px;font-size:1.1rem;color:var(--leaf-dark);font-weight:700;transition:background .12s ease;}
.stepper button:hover{background:var(--kraft-dark);}
.stepper button:active{transform:scale(.92);}
.stepper .qty-display{min-width:24px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.88rem;color:var(--ink);}

.p-cell-line{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--leaf-dark);white-space:nowrap;font-size:.88rem;}
.p-cell-line.empty{color:#a89b83;font-weight:500;}

/* Small product badges (Premium / Advance-only) */
.badge{display:inline-block;font-size:.64rem;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle;white-space:nowrap;}
.badge-premium{background:#f3e2c2;color:#8a5a12;}
.badge-customized{background:#f4ddd8;color:var(--chili);}

/* Commerce info strip on category pages */
.commerce-info-bar{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 16px;}
.commerce-info-bar .trust-chip{background:var(--kraft);border-color:var(--kraft-dark);color:#5b5142;}

/* Back / continue-shopping row */
.step-nav-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.back-link{background:none;border:none;color:#6b6152;font-size:.84rem;font-weight:600;padding:6px 0;display:flex;align-items:center;gap:4px;}
.back-link:hover{color:var(--ink);}
.cta-split{display:flex;gap:10px;margin-top:16px;}
.cta-split .btn{flex:1;justify-content:center;}

@media (max-width:700px){
  .product-table thead{display:none;}
  .product-table, .product-table tbody, .product-table tr, .product-table td{display:block;width:100%;}
  .product-table tr{padding:13px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;}
  .product-table td{padding:0;border:none;}
  .product-table td.p-cell-name{grid-column:1/-1;}
  .product-table td.p-cell-price{font-size:.82rem;color:#5b5142;}
  .product-table td.p-cell-price::before{content:"Price: ";font-family:'IBM Plex Mono',monospace;font-size:.68rem;text-transform:uppercase;color:#9a8f7a;}
  .product-table td.p-cell-qty{justify-self:start;}
  .product-table td.p-cell-line{justify-self:end;align-self:center;}
}

/* ══════════════ Cart page (full page, step 1) ══════════════ */
.cart-line{display:flex;gap:12px;align-items:center;background:var(--kraft);border-radius:12px;padding:12px;box-shadow:var(--shadow-sm);margin-bottom:8px;}
.cart-line .p-icon{width:44px;height:44px;font-size:1.4rem;}
.cart-line-info{flex:1;min-width:0;}
.cart-line-info .name{font-weight:700;font-size:.9rem;}
.cart-line-info .unit-price{font-size:.76rem;color:#7a6f5c;font-family:'IBM Plex Mono',monospace;}
.cart-line-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.cart-line-total{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:.88rem;}
.cart-remove-icon{background:none;border:none;color:var(--chili);font-size:1rem;padding:4px;border-radius:6px;line-height:1;}
.cart-remove-icon:hover{background:rgba(184,74,62,.1);}
.empty-cart-block{text-align:center;padding:50px 20px;color:#8a7f6b;}
.empty-cart-block .ic{font-size:2.4rem;display:block;margin-bottom:10px;}

.cart-summary-card{background:var(--kraft);border-radius:12px;padding:16px;margin-top:16px;box-shadow:var(--shadow-sm);}
.summary-line{display:flex;justify-content:space-between;font-size:.88rem;padding:6px 0;border-bottom:1px dashed var(--kraft-dark);}
.summary-line.total{font-weight:700;font-family:'IBM Plex Mono',monospace;font-size:1.02rem;border-bottom:none;padding-top:12px;}

/* ══════════════ Checkout (step 2) ══════════════ */
.form-card, .summary-card{background:var(--kraft);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px;border:1px solid var(--kraft-dark);}
.form-card h3, .summary-card h3{margin-top:0;font-size:1.02rem;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:5px;}
.field input, .field textarea, .field select{width:100%;padding:11px 12px;border:1px solid var(--kraft-dark);border-radius:8px;background:var(--paper);font-family:inherit;font-size:.95rem;}
.field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--leaf);outline-offset:1px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:520px){.field-row{grid-template-columns:1fr;}}

.pay-options{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.pay-option{border:1.5px solid var(--kraft-dark);border-radius:12px;padding:13px 14px;cursor:pointer;background:var(--paper);display:block;}
.pay-option input{margin-right:8px;}
.pay-option.selected{border-color:var(--leaf);background:#eaf1e6;}
.pay-option-title{font-weight:700;font-size:.94rem;}
.pay-option-sub{font-size:.78rem;color:#6b6152;margin-top:2px;}
.advance-details{background:var(--paper);border:1px dashed var(--kraft-dark);border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.advance-details h4{margin:0 0 8px;font-size:.82rem;text-transform:uppercase;letter-spacing:.03em;color:var(--leaf-dark);font-family:'IBM Plex Mono',monospace;font-weight:600;}
.advance-details .acct-row{font-size:.85rem;padding:4px 0;display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--kraft-dark);}
.advance-details .acct-row:last-of-type{border-bottom:none;}
.advance-note{font-size:.8rem;color:#6b6152;margin-top:8px;}
.order-status{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:.86rem;}
.order-status.ok{background:#e2eedd;color:var(--leaf-dark);}
.order-status.err{background:#f4e0dd;color:var(--chili);}
.order-status.info{background:#e9eef7;color:#33507a;}
.inline-submit{width:100%;background:var(--marigold);color:#241705;border:none;border-radius:10px;padding:14px;font-weight:700;font-size:.98rem;margin-top:6px;}

.payment-restricted-note{background:#f4ddd8;border:1px solid #e5b8ae;color:#7c2e25;border-radius:10px;padding:12px 14px;font-size:.85rem;margin-bottom:16px;line-height:1.4;}

.free-delivery-progress{margin:4px 0 16px;}
.fdp-text{font-size:.8rem;color:#5b5142;margin-bottom:6px;}
.fdp-text.unlocked{color:var(--leaf-dark);font-weight:600;}
.fdp-track{height:6px;border-radius:4px;background:var(--kraft-dark);overflow:hidden;}
.fdp-fill{height:100%;background:var(--leaf);border-radius:4px;transition:width .3s ease;}

@media (min-width:860px){.checkout-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start;}}

/* ══════════════ Sticky bottom commerce bar ══════════════ */
.sticky-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--soil);color:var(--kraft);
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:11px 16px;box-shadow:0 -6px 18px rgba(0,0,0,.25);
  height:var(--sticky-h);
}
.sticky-bar-info{display:flex;flex-direction:column;line-height:1.25;}
.sb-count{font-size:.72rem;opacity:.75;}
.sb-total{font-size:1.05rem;font-weight:700;}
.sticky-bar-btn{background:var(--marigold);color:#241705;border:none;border-radius:9px;padding:12px 20px;font-weight:700;font-size:.92rem;white-space:nowrap;}
.sticky-bar-btn:disabled{opacity:.6;}

/* ══════════════ Contact ══════════════ */
.contact-grid{display:grid;grid-template-columns:1fr;gap:18px;}
@media (min-width:860px){.contact-grid{grid-template-columns:1fr 1fr;}}

<script>
// ── Hoja Seeds — storefront logic ──────────────────────────────────
// Flow: browse -> Summary (step 1, grouped by category) -> Delivery
// (step 2, gated — "Confirm Delivery" must succeed before moving on) ->
// Payment (step 3) -> Confirmation (step 4). A sticky bottom bar is the
// primary mobile action through every step.

// ---- Price store: merges DEFAULT_PRODUCTS with Super Admin overrides ----
// Overrides are keyed by product id and can carry a price and/or a type
// override: { [id]: { price?: number, type?: string } }
const Prices = {
  KEY: "hoja_admin_overrides",
  _cache: null,
  overrides() {
    try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; }
    catch { return {}; }
  },
  async getProducts() {
    if (CONFIG.SHEET_WEBHOOK_URL) {
      try {
        const res = await fetch(`${CONFIG.SHEET_WEBHOOK_URL}?action=products`);
        const data = await res.json();
        if (Array.isArray(data) && data.length) return data;
      } catch (e) { console.warn("Sheet fetch failed, using local data:", e); }
    }
    const ov = this.overrides();
    return DEFAULT_PRODUCTS.map(p => {
      const o = ov[p.id];
      if (!o) return p;
      return { ...p, price: o.price != null ? o.price : p.price, type: o.type || p.type };
    });
  },
  async load() { this._cache = await this.getProducts(); return this._cache; },
  get() { return this._cache || DEFAULT_PRODUCTS; }
};

// ---- Store settings (pricing rules): merges CONFIG.PRICING_RULES with
// Super Admin overrides — Sheet first if configured, else local storage.
const Settings = {
  KEY: "hoja_pricing_rules",
  _cache: null,
  overrides() {
    try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; }
    catch { return {}; }
  },
  async fetchRules() {
    if (CONFIG.SHEET_WEBHOOK_URL) {
      try {
        const res = await fetch(`${CONFIG.SHEET_WEBHOOK_URL}?action=settings`);
        const data = await res.json();
        if (data && Object.keys(data).length) return { ...CONFIG.PRICING_RULES, ...data };
      } catch (e) { console.warn("Sheet settings fetch failed, using local data:", e); }
    }
    return { ...CONFIG.PRICING_RULES, ...this.overrides() };
  },
  async load() { this._cache = await this.fetchRules(); return this._cache; },
  get() { return this._cache || { ...CONFIG.PRICING_RULES, ...this.overrides() }; }
};

// Delivery fee follows the commercial rules: Advance orders (including
// every customized-collection order, which is always advance-only) get
// free delivery at the threshold; COD is a flat normal-courier charge.
function computeDeliveryFee(paymentMethod, subtotal, forceAdvance) {
  const r = Settings.get();
  if (paymentMethod === "Advance Payment" || forceAdvance) {
    return subtotal >= r.FREE_DELIVERY_THRESHOLD ? 0 : r.ADVANCE_DELIVERY_FEE;
  }
  return r.COD_DELIVERY_FEE;
}

// Small "★ Premium" / "100% Advance" markers next to a product's name.
function productBadgeHTML(p) {
  if (p.type === "premium") return `<span class="badge badge-premium">★ Premium</span>`;
  if (p.type === "customized-collection") return `<span class="badge badge-customized">100% Advance</span>`;
  return "";
}

// ---- Cart ----
const Cart = {
  KEY: "hoja_cart",
  items() {
    try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; } // {productId: qty}
    catch { return {}; }
  },
  save(items) {
    localStorage.setItem(this.KEY, JSON.stringify(items));
    this.renderCount();
    refreshStickyBar();
  },
  setQty(id, qty) {
    const items = this.items();
    if (qty <= 0) delete items[id]; else items[id] = qty;
    this.save(items);
  },
  qtyOf(id) { return this.items()[id] || 0; },
  clear() { this.save({}); },
  clearSubmitted(submittedItems) {
    const items = this.items();
    submittedItems.forEach(item => {
      const current = Number(items[item.productId]) || 0;
      if (current <= item.quantity) delete items[item.productId];
      else items[item.productId] = current - item.quantity;
    });
    this.save(items);
  },
  count() { return Object.values(this.items()).reduce((a, b) => a + b, 0); },
  totalAmount() {
    const items = this.items();
    const products = Prices.get();
    return Object.keys(items).reduce((sum, id) => {
      const p = products.find(p => p.id === id);
      return p ? sum + p.price * items[id] : sum;
    }, 0);
  },
  // Cart lines as {p, qty, line}, grouped by category — used by the
  // Summary page and by every analytics call that needs an items[] array.
  linesByCategory() {
    const products = Prices.get();
    const items = this.items();
    const byCat = {};
    Object.keys(items).forEach(id => {
      const p = products.find(p => p.id === id);
      if (!p) return;
      byCat[p.cat] = byCat[p.cat] || [];
      byCat[p.cat].push({ p, qty: items[id], line: p.price * items[id] });
    });
    return byCat;
  },
  flatLines() {
    const byCat = this.linesByCategory();
    return Object.values(byCat).flat();
  },
  renderCount() {
    const countEl = document.getElementById("cartCount");
    if (countEl) countEl.textContent = this.count();
  }
};

// ---- Toast ----
const Toast = {
  show(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(this._timer);
    this._timer = setTimeout(() => t.classList.remove("show"), 2200);
  }
};

// ---- Analytics: GA4 (gtag) + Meta Pixel, mirrored events, deduplicated ----
// Both trackers are no-ops until CONFIG.GA4_MEASUREMENT_ID / META_PIXEL_ID
// are filled in (see js/config.js) — calling these functions is always
// safe even with nothing configured.
//
// Dedup strategy:
//  - SPA page_view is fired exactly once per route change here, with the
//    initial automatic gtag pageview disabled (send_page_view:false in
//    index.html) — otherwise the first route gets counted twice.
//  - add_to_cart / remove_from_cart only fire on an actual quantity delta
//    (never on a plain re-render), so ordinary UI redraws can't replay them.
//  - view_cart only fires on real navigation into the Summary page, not on
//    every quantity edit made while already there.
//  - purchase/Purchase fires once per order, keyed by a single generated
//    orderId used as BOTH the GA4 transaction_id and the Meta eventID —
//    the standard way to prevent Pixel/Conversions-API double counting if
//    server-side tracking is added later. The submit button is disabled
//    during submission so a double click can't fire it twice either.
const Analytics = {
  hasGA() { return typeof window.gtag === "function" && !!CONFIG.GA4_MEASUREMENT_ID; },
  hasMeta() { return typeof window.fbq === "function" && !!CONFIG.META_PIXEL_ID; },

  gaItem(p, qty) {
    return { item_id: p.id, item_name: p.name, item_category: (CATEGORY_META[p.cat] || {}).label || p.cat, price: p.price, quantity: qty || 1 };
  },

  pageview(view, title) {
    if (this.hasGA()) gtag("event", "page_view", { page_path: "/" + view, page_title: title, page_location: location.href });
    if (this.hasMeta()) fbq("track", "PageView");
  },
  viewItemList(cat, products) {
    if (this.hasGA()) gtag("event", "view_item_list", {
      item_list_id: cat, item_list_name: CATEGORY_META[cat].label,
      items: products.map(p => this.gaItem(p))
    });
    if (this.hasMeta()) fbq("track", "ViewContent", { content_type: "product_group", content_category: cat, content_ids: products.map(p => p.id) });
  },
  addToCart(p, qty) {
    if (this.hasGA()) gtag("event", "add_to_cart", { currency: "PKR", value: p.price * qty, items: [this.gaItem(p, qty)] });
    if (this.hasMeta()) fbq("track", "AddToCart", { content_ids: [p.id], content_type: "product", value: p.price * qty, currency: "PKR" });
  },
  removeFromCart(p, qty) {
    if (this.hasGA()) gtag("event", "remove_from_cart", { currency: "PKR", value: p.price * qty, items: [this.gaItem(p, qty)] });
  },
  viewCart(lines, subtotal) {
    if (this.hasGA()) gtag("event", "view_cart", { currency: "PKR", value: subtotal, items: lines.map(l => this.gaItem(l.p, l.qty)) });
  },
  beginCheckout(lines, subtotal) {
    if (this.hasGA()) gtag("event", "begin_checkout", { currency: "PKR", value: subtotal, items: lines.map(l => this.gaItem(l.p, l.qty)) });
    if (this.hasMeta()) fbq("track", "InitiateCheckout", { value: subtotal, currency: "PKR", contents: lines.map(l => ({ id: l.p.id, quantity: l.qty })), content_type: "product" });
  },
  addShippingInfo(lines, subtotal) {
    if (this.hasGA()) gtag("event", "add_shipping_info", { currency: "PKR", value: subtotal, items: lines.map(l => this.gaItem(l.p, l.qty)) });
  },
  addPaymentInfo(lines, subtotal, paymentMethod) {
    if (this.hasGA()) gtag("event", "add_payment_info", { currency: "PKR", value: subtotal, payment_type: paymentMethod, items: lines.map(l => this.gaItem(l.p, l.qty)) });
    if (this.hasMeta()) fbq("track", "AddPaymentInfo", { value: subtotal, currency: "PKR", contents: lines.map(l => ({ id: l.p.id, quantity: l.qty })) });
  },
  purchase(orderId, payload, lines) {
    if (this.hasGA()) gtag("event", "purchase", {
      transaction_id: orderId, currency: "PKR", value: payload.total, shipping: payload.deliveryFee,
      items: lines.map(l => this.gaItem(l.p, l.qty))
    });
    if (this.hasMeta()) fbq("track", "Purchase",
      { value: payload.total, currency: "PKR", contents: lines.map(l => ({ id: l.p.id, quantity: l.qty })), content_type: "product" },
      { eventID: orderId }
    );
  }
};

// ---- Sticky bottom commerce bar ----
// Label + action change with context: "View Cart" while browsing,
// "Continue to Delivery" on Summary, "Confirm Delivery" on the Delivery
// step (gated — it won't advance until the form is valid), then "Confirm
// & Place Order" on Payment.
function refreshStickyBar() {
  const bar = document.getElementById("stickyBar");
  const countEl = document.getElementById("sbCount");
  const totalEl = document.getElementById("sbTotal");
  const btn = document.getElementById("sbAction");
  if (!bar) return;
  const view = Router.current;
  const count = Cart.count();

  if (count === 0 || view === "confirmation") {
    bar.style.display = "none";
    document.body.classList.remove("has-sticky-bar");
    return;
  }

  const subtotal = Cart.totalAmount();
  btn.disabled = false;
  btn.removeAttribute("form");
  btn.setAttribute("type", "button");
  btn.onclick = null;

  if (view === "delivery") {
    countEl.textContent = `${count} item${count === 1 ? "" : "s"}`;
    totalEl.textContent = `${CONFIG.CURRENCY} ${subtotal}`;
    btn.textContent = "Confirm Delivery";
    btn.setAttribute("form", "deliveryForm");
    btn.setAttribute("type", "submit");
  } else if (view === "payment" && Views._order) {
    countEl.textContent = `${count} item${count === 1 ? "" : "s"}`;
    totalEl.textContent = `${CONFIG.CURRENCY} ${Views._order.total}`;
    btn.textContent = "Confirm & Place Order";
    btn.setAttribute("form", "paymentForm");
    btn.setAttribute("type", "submit");
  } else if (view === "cart") {
    countEl.textContent = `${count} item${count === 1 ? "" : "s"}`;
    totalEl.textContent = `${CONFIG.CURRENCY} ${subtotal}`;
    btn.textContent = "Continue to Delivery →";
    btn.onclick = () => Router.go("delivery");
  } else {
    countEl.textContent = `${count} item${count === 1 ? "" : "s"}`;
    totalEl.textContent = `${CONFIG.CURRENCY} ${subtotal}`;
    btn.textContent = "View Cart →";
    btn.onclick = () => Router.go("cart");
  }
  bar.style.display = "flex";
  document.body.classList.add("has-sticky-bar");
}

// ---- Journey / progress indicator (Summary, Delivery, Payment, Confirmed) ----
function journeyBarHTML(step) {
  const labels = ["Summary", "Delivery", "Payment", "Confirmed"];
  return `<div class="journey-bar">${labels.map((label, i) => {
    const n = i + 1;
    let cls = "";
    if (step === 4) cls = "done";
    else if (n < step) cls = "done";
    else if (n === step) cls = "active";
    const symbol = cls === "done" ? "✓" : n;
    const line = i < labels.length - 1 ? `<div class="journey-line"></div>` : "";
    return `<div class="journey-step ${cls}"><span class="jn">${symbol}</span><span class="jl">${label}</span></div>${line}`;
  }).join("")}</div>`;
}

// Status chips shown under the journey bar on Delivery/Payment/Confirmed —
// makes it obvious at a glance what's already locked in.
function flowStatusHTML(deliveryConfirmed, paymentConfirmed) {
  return `<div class="flow-status">
    <span class="fs-item ${deliveryConfirmed ? "done" : ""}">Delivery: ${deliveryConfirmed ? "Confirmed ✓" : "Pending"}</span>
    <span class="fs-item ${paymentConfirmed ? "done" : ""}">Payment: ${paymentConfirmed ? "Confirmed ✓" : "Pending"}</span>
  </div>`;
}

                    <option value="Bank Transfer">Bank Transfer</option>
                  </select>
                </div>
                <div class="field"><label for="o-txn-ref">Transaction ID / reference</label><input id="o-txn-ref" placeholder="e.g. TXN123456"></div>
                <p class="advance-note">We'll confirm your payment and dispatch your order once received.</p>
              </div>

              <button class="inline-submit" type="submit" id="submitBtn">Confirm & Place Order — ${CONFIG.CURRENCY} ${subtotal + defaultFee}</button>
              <div id="orderStatus"></div>
            </form>
          </div>
          <div class="summary-card">
            <h3>Order summary</h3>
            ${lines.map(l => `<div class="summary-line"><span>${l.p.name} × ${l.qty}</span><span class="mono">${CONFIG.CURRENCY} ${l.line}</span></div>`).join("")}
            <div class="summary-line"><span>Delivery</span><span class="mono" id="summaryDeliveryFee">${CONFIG.CURRENCY} ${defaultFee}</span></div>
            <div class="summary-line total"><span>Total</span><span id="summaryTotal">${CONFIG.CURRENCY} ${subtotal + defaultFee}</span></div>
          </div>
        </div>
      </section>`;

    if (codAllowed) document.getElementById("payCOD").classList.add("selected");
    this.renderFreeDeliveryProgress(defaultMethod, subtotal, hasCustomized);
    Analytics.addPaymentInfo(lines, subtotal, defaultMethod);
  },

  // "Rs.320 more for FREE delivery" — only meaningful while paying in
  // advance (COD's fee doesn't move with subtotal).
  renderFreeDeliveryProgress(method, subtotal, hasCustomized) {
    const el = document.getElementById("freeDeliveryProgress");
    if (!el) return;
    const r = Settings.get();
    if (method !== "Advance Payment" && !hasCustomized) { el.innerHTML = ""; return; }
    const pct = Math.min(100, Math.round((subtotal / r.FREE_DELIVERY_THRESHOLD) * 100));
    if (subtotal >= r.FREE_DELIVERY_THRESHOLD) {
      el.innerHTML = `<div class="fdp-text unlocked">🎉 You've unlocked FREE delivery!</div>`;
      return;
    }
    const remaining = r.FREE_DELIVERY_THRESHOLD - subtotal;
    el.innerHTML = `
      <div class="fdp-text">${CONFIG.CURRENCY} ${remaining} more for FREE delivery</div>
      <div class="fdp-track"><div class="fdp-fill" style="width:${pct}%"></div></div>`;
  },

  selectPay(onId, offId) {
    document.getElementById(onId).classList.add("selected");
    document.getElementById(offId)?.classList.remove("selected");
    this.updateDeliveryFee();
    refreshStickyBar();
  },

  updateDeliveryFee() {
    const method = document.querySelector('input[name="pay"]:checked').value;
    const hasCustomized = Cart.flatLines().some(l => l.p.type === "customized-collection");
    const subtotal = this._order.subtotal;
    const fee = computeDeliveryFee(method, subtotal, hasCustomized && !this._order.codAllowed);
    const total = subtotal + fee;
    document.getElementById("summaryDeliveryFee").textContent = `${CONFIG.CURRENCY} ${fee}`;
    document.getElementById("summaryTotal").textContent = `${CONFIG.CURRENCY} ${total}`;
    document.getElementById("submitBtn").textContent = `Confirm & Place Order — ${CONFIG.CURRENCY} ${total}`;
    document.getElementById("advanceDetails").style.display = method === "Advance Payment" ? "block" : "none";
    this._order.deliveryFee = fee;
    this._order.total = total;
    this.renderFreeDeliveryProgress(method, subtotal, hasCustomized);
    Analytics.addPaymentInfo(Cart.flatLines(), subtotal, method);
  },

  async submitOrder(e) {
    e.preventDefault();
    const status = document.getElementById("orderStatus");
    let paymentMethod = document.querySelector('input[name="pay"]:checked').value;
    if (this._order && this._order.codAllowed === false) paymentMethod = "Advance Payment";

    const transactionReference = paymentMethod === "Advance Payment" ? document.getElementById("o-txn-ref").value.trim() : "";
    if (paymentMethod === "Advance Payment" && transactionReference.length < 3) {
      this.showOrderError(status, "Please add a valid transaction ID so we can verify the payment.");
      return;
    }

    let normalizedPhone;
    try {
      normalizedPhone = normalizePakistanMobile(this._order.delivery.phone);
    } catch (error) {
      this.showOrderError(status, error.message);
      return;
    }

    const inlineBtn = document.getElementById("submitBtn");
    const stickyBtn = document.getElementById("sbAction");
    inlineBtn.disabled = true;
    inlineBtn.textContent = "Placing order…";
    if (stickyBtn) { stickyBtn.disabled = true; stickyBtn.textContent = "Placing order…"; }

    const lines = Cart.flatLines();
    const delivery = this._order.delivery;
    const request = {
      type: "order",
      customer: {
        name: delivery.name.trim(), phone: normalizedPhone,
        address: delivery.address.trim(), city: delivery.city.trim(),
        postal: delivery.postal.trim(), notes: delivery.notes.trim()
      },
      payment: {
        method: paymentMethod,
        advanceMethod: paymentMethod === "Advance Payment" ? document.getElementById("o-advance-method").value : "",
        transactionReference
      },
      items: lines.map(line => ({ productId: line.p.id, quantity: line.qty }))
    };
    const requestSignature = JSON.stringify(request);
    if (!this._order.idempotencyKey || this._order.idempotencyRequestSignature !== requestSignature) {
      this._order.idempotencyKey = createIdempotencyKey();
      this._order.idempotencyRequestSignature = requestSignature;
    }
    request.idempotencyKey = this._order.idempotencyKey;

    const result = await Orders.submit(request);
    if (result.ok) {
      const confirmedLines = result.items.map(item => {
        const localProduct = Prices.get().find(product => product.id === item.productId) || {};
        return { p: { ...localProduct, id: item.productId, name: item.name, price: item.unitPrice, cat: item.category || localProduct.cat }, qty: item.quantity, line: item.lineTotal };
      });
      this.showOrderConfirmation(result);
      Cart.clearSubmitted(result.items);
      this._order = null;
      try { Analytics.purchase(result.orderId, result, confirmedLines); }
      catch (error) { console.error("Purchase analytics failed:", error); }
    } else {
      this.showOrderError(status, result.error?.message || "Couldn't place the order. Please try again shortly.");
      inlineBtn.disabled = false;
      inlineBtn.textContent = `Confirm & Place Order — ${CONFIG.CURRENCY} ${this._order.total}`;
      if (stickyBtn) { stickyBtn.disabled = false; stickyBtn.textContent = "Confirm & Place Order"; }
    }
  },

  showOrderError(status, message) {
    status.replaceChildren();
    const box = document.createElement("div");
    box.className = "order-status err";
    box.textContent = message;
    if (CONFIG.WHATSAPP_NUMBER) {
      box.appendChild(document.createTextNode(" "));
      const link = document.createElement("a");
      link.href = `https://wa.me/${encodeURIComponent(CONFIG.WHATSAPP_NUMBER)}`;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Send the order on WhatsApp instead.";
      box.appendChild(link);
    }
    status.appendChild(box);
  },

  // ── Step 4: Confirmation ──────────────────────────────────────────
  showOrderConfirmation(payload) {
    Router.current = "confirmation";
    document.title = PAGE_TITLES.confirmation;
    document.querySelectorAll(".nav-tab").forEach(b => b.classList.remove("active"));
    window.scrollTo({ top: 0, behavior: "smooth" });
    const isCOD = payload.paymentMethod === "Cash on Delivery";
    const customer = payload.customer || {};
    const itemSummary = payload.items.map(item => `${item.name} x${item.quantity}`).join(", ");
    document.getElementById("app").innerHTML = `
      <section class="page narrow">
        ${journeyBarHTML(4)}
        ${flowStatusHTML(true, false)}
        <div class="page-head">
          <h2>Thanks, ${escapeHTML(customer.name)} — your order is in! 🌱</h2>
          <p class="tagline">We'll call ${escapeHTML(customer.phone)} shortly to confirm delivery to ${escapeHTML(customer.city)}.</p>
        </div>
        <div class="cart-summary-card">
          <h3 style="margin-top:0">Order summary</h3>
          <div class="summary-line"><span>Order ID</span><span class="mono">${escapeHTML(payload.orderId)}</span></div>
          <div class="summary-line"><span>Items</span><span style="text-align:right;max-width:60%">${escapeHTML(itemSummary)}</span></div>
          <div class="summary-line"><span>Payment method</span><span>${escapeHTML(payload.paymentMethod)}${payload.advanceMethod ? " — " + escapeHTML(payload.advanceMethod) : ""}</span></div>
          <div class="summary-line"><span>Payment status</span><span>${escapeHTML(payload.paymentStatus)}</span></div>
          ${payload.transactionReference ? `<div class="summary-line"><span>Transaction ref</span><span class="mono">${escapeHTML(payload.transactionReference)}</span></div>` : ""}
          <div class="summary-line"><span>Delivery fee</span><span class="mono">${CONFIG.CURRENCY} ${payload.deliveryFee}</span></div>
          <div class="summary-line total"><span>${isCOD ? "Pay on delivery" : "Submitted total"}</span><span>${CONFIG.CURRENCY} ${payload.total}</span></div>
        </div>
        <p class="advance-note" style="margin-top:12px">${isCOD
          ? "Have this amount ready in cash when your order arrives."
          : "Your payment is awaiting verification. We'll dispatch after it is verified."}</p>
        <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:18px" onclick="Router.go('vegetables')">Continue shopping</button>
      </section>`;
    refreshStickyBar();
    try { Analytics.pageview("confirmation", document.title); }
    catch (error) { console.error("Confirmation page analytics failed:", error); }
  }
};

// ---- Order/contact submission (Google Sheet, with local fallback log) ----
const Orders = {
  async submit(payload) {
    if (!CONFIG.SHEET_WEBHOOK_URL) {
      if (payload.type === "contact") {
        const log = JSON.parse(localStorage.getItem("hoja_contacts") || "[]");
        log.push(payload);
        localStorage.setItem("hoja_contacts", JSON.stringify(log));
        return { ok: true, demo: true };
      }
      return { ok: false, error: { code: "ORDER_SERVICE_NOT_CONFIGURED", message: "Online ordering is not configured yet." } };
    }
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);
    try {
      const response = await fetch(CONFIG.SHEET_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload), signal: controller.signal
      });
      if (!response.ok) throw new Error(`Order service returned HTTP ${response.status}.`);
      const result = await response.json();
      if (!result || typeof result.ok !== "boolean") throw new Error("Order service returned an invalid response.");
      if (payload.type === "order" && result.ok && !isValidOrderResult(result)) throw new Error("Order service returned an incomplete order confirmation.");
      return result;
    } catch (e) {
      console.error("Order submit failed:", e);
      return { ok: false, error: { code: e.name === "AbortError" ? "ORDER_TIMEOUT" : "ORDER_NETWORK_ERROR", message: e.name === "AbortError" ? "The order request timed out. Please retry with the same order." : "Couldn't reach the order service. Check your connection and try again." } };
    } finally {
      clearTimeout(timeout);
    }
  }
};

function isValidOrderResult(result) {
  return typeof result.orderId === "string" && result.orderId.length > 0 && typeof result.paymentStatus === "string"
    && Array.isArray(result.items) && result.items.every(item => item && typeof item.productId === "string" && typeof item.name === "string" && Number.isInteger(item.quantity) && item.quantity > 0 && Number.isFinite(item.unitPrice) && Number.isFinite(item.lineTotal))
    && Number.isFinite(result.subtotal) && Number.isFinite(result.deliveryFee) && Number.isFinite(result.total);
}

function normalizePakistanMobile(value) {
  const digits = String(value || "").replace(/\D/g, "");
  let normalized = digits;
  if (/^03\d{9}$/.test(digits)) normalized = "92" + digits.slice(1);
  else if (/^3\d{9}$/.test(digits)) normalized = "92" + digits;
  if (!/^923\d{9}$/.test(normalized)) throw new Error("Enter a valid Pakistan mobile number.");
  return normalized;
}

function createIdempotencyKey() {
  if (window.crypto?.randomUUID) return window.crypto.randomUUID();
  if (window.crypto?.getRandomValues) {
    const bytes = new Uint8Array(16);
    window.crypto.getRandomValues(bytes);
    return Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
  }
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
}

function escapeHTML(value) {
  return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// ---- Init ----
document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("navToggle").addEventListener("click", () => {
  const open = document.getElementById("navTabs").classList.toggle("open");
  document.getElementById("navToggle").setAttribute("aria-expanded", open);
});
(async () => {
  await Promise.all([Prices.load(), Settings.load()]);
  Cart.renderCount();
  Router.go("home");
})();
